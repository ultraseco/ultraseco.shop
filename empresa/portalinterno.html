<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interno | Base de Datos de Productos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0c0c0e;
            color: #e4e4e7;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,10%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,7%,1) 0, transparent 50%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(23, 23, 26, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
        .price-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0c0c0e;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                    Portal Interno
                </h1>
                <p class="text-gray-400 mt-2 flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4"></i>
                    Gestión de Base de Datos de Productos
                </p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="glass px-4 py-2 rounded-xl flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-sm font-medium">Neon DB Conectado</span>
                </div>
                <button id="refreshBtn" class="glass p-2 rounded-xl hover:bg-white/5 transition-colors" title="Refrescar datos">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-gray-400"></i>
                </button>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider font-semibold">Total Productos</p>
                <h3 id="totalProducts" class="text-2xl font-bold">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider font-semibold">Precio Promedio</p>
                <h3 id="avgPrice" class="text-2xl font-bold">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider font-semibold">Categorías</p>
                <h3 id="totalCats" class="text-2xl font-bold">--</h3>
            </div>
            <div class="glass p-6 rounded-2xl">
                <p class="text-gray-400 text-sm mb-1 uppercase tracking-wider font-semibold">Sin Stock</p>
                <h3 id="outOfStock" class="text-2xl font-bold text-orange-400">--</h3>
            </div>
        </div>

        <!-- Controls -->
        <div class="glass p-4 rounded-2xl mb-8 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative flex-1 w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre o presentación..." 
                    class="w-full bg-black/20 border border-white/5 rounded-xl py-2.5 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
            </div>
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="categoryPills">
                <!-- Category pills will be injected here -->
            </div>
            <select id="sortSelect" class="bg-black/20 border border-white/5 rounded-xl py-2.5 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500/50 appearance-none cursor-pointer">
                <option value="name-asc">Nombre (A-Z)</option>
                <option value="name-desc">Nombre (Z-A)</option>
                <option value="price-asc">Precio (Menor-Mayor)</option>
                <option value="price-desc">Precio (Mayor-Menor)</option>
                <option value="stock-desc">Mayor Stock</option>
            </select>
        </div>

        <!-- Products Grid -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Product cards will be injected here -->
            <div class="col-span-full py-20 text-center text-gray-500">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-current border-t-transparent text-blue-500 rounded-full mb-4" role="status"></div>
                <p>Cargando base de datos...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // --- DATA SOURCE CONFIG ---
        // Replace this with your actual fetch logic from Prisma/Proxy
        const MOCK_DATA = []; // Will be populated by the fetch

        let products = [];
        let filteredProducts = [];
        let currentCategory = 'all';

        async function fetchProducts() {
            try {
                // Here we would ideally fetch from a local endpoint or Neon Data API
                // For this visualization, we'll try to use the window data if injected, 
                // or point to a local products.json if it exists.
                const response = await fetch('data/products.json').catch(() => null);
                if (response && response.ok) {
                    products = await response.json();
                } else {
                    // Fallback to embedded data if any, or a message
                    console.warn('No products found. Please ensure update-portal.js has been run.');
                    products = window.INITIAL_PRODUCTS || [];
                }
                
                renderPortal();
            } catch (err) {
                console.error('Error loading products:', err);
                document.getElementById('productGrid').innerHTML = `
                    <div class="col-span-full py-20 glass rounded-2xl text-center">
                        <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
                        <h3 class="text-xl font-bold mb-2">Error al conectar con la base de datos</h3>
                        <p class="text-gray-400">Verifica que el script de actualización haya generado data/products.json</p>
                    </div>
                `;
            }
        }

        function renderPortal() {
            updateStats();
            renderCategories();
            filterAndRender();
            lucide.createIcons();
        }

        function updateStats() {
            const total = products.length;
            const avg = products.length ? (products.reduce((acc, p) => acc + parseFloat(p.precio), 0) / products.length).toFixed(2) : 0;
            const cats = new Set(products.map(p => p.categoria)).size;
            const outOfStock = products.filter(p => p.stock === 0).length;

            document.getElementById('totalProducts').textContent = total;
            document.getElementById('avgPrice').textContent = `Ref. ${avg}`;
            document.getElementById('totalCats').textContent = cats;
            document.getElementById('outOfStock').textContent = outOfStock;
        }

        function renderCategories() {
            const categories = ['all', ...new Set(products.map(p => p.categoria))];
            const container = document.getElementById('categoryPills');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-4 py-2 rounded-xl text-sm font-medium transition-all whitespace-nowrap
                    ${currentCategory === cat ? 'bg-blue-600 text-white' : 'glass text-gray-400 hover:text-white'}">
                    ${cat === 'all' ? 'Todos' : cat}
                </button>
            `).join('');
        }

        function filterAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            filteredProducts = products.filter(p => {
                const matchesSearch = p.nombre.toLowerCase().includes(searchTerm) || 
                                     p.presentacion.toLowerCase().includes(searchTerm);
                const matchesCat = currentCategory === 'all' || p.categoria === currentCategory;
                return matchesSearch && matchesCat;
            });

            // Sorting
            filteredProducts.sort((a, b) => {
                if (sortBy === 'name-asc') return a.nombre.localeCompare(b.nombre);
                if (sortBy === 'name-desc') return b.nombre.localeCompare(a.nombre);
                if (sortBy === 'price-asc') return parseFloat(a.precio) - parseFloat(b.precio);
                if (sortBy === 'price-desc') return parseFloat(b.precio) - parseFloat(a.precio);
                if (sortBy === 'stock-desc') return b.stock - a.stock;
                return 0;
            });

            const grid = document.getElementById('productGrid');
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-500">No se encontraron productos coincidentes.</div>`;
                return;
            }

            grid.innerHTML = filteredProducts.map(p => `
                <div class="glass p-6 rounded-2xl product-card group">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-xs font-bold uppercase tracking-widest text-blue-500 bg-blue-500/10 px-2 py-1 rounded">
                            ${p.categoria}
                        </span>
                        <div class="flex items-center gap-1 text-sm ${p.stock > 0 ? 'text-green-500' : 'text-orange-500'}">
                            <i data-lucide="package" class="w-4 h-4"></i>
                            ${p.stock}
                        </div>
                    </div>
                    <h4 class="text-xl font-bold mb-1">${p.nombre}</h4>
                    <p class="text-gray-400 text-sm mb-6">${p.presentacion}</p>
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
                        <div class="price-badge px-4 py-2 rounded-xl text-white font-bold">
                            Ref. ${parseFloat(p.precio).toFixed(2)}
                        </div>
                        <span class="text-[10px] text-gray-600 italic">
                            Act: ${new Date(p.fecha_act).toLocaleDateString()}
                        </span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.setCategory = (cat) => {
            currentCategory = cat;
            renderPortal();
        };

        // Listeners
        document.getElementById('searchInput').addEventListener('input', filterAndRender);
        document.getElementById('sortSelect').addEventListener('change', filterAndRender);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            document.getElementById('refreshBtn').classList.add('animate-spin');
            setTimeout(() => {
                fetchProducts();
                document.getElementById('refreshBtn').classList.remove('animate-spin');
            }, 1000);
        });

        // Initialize
        fetchProducts();
    </script>
</body>
</html>
