<html lang="es">
<head>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .price-text { display: none; }
        @media print {
            .no-print { display: none !important; }
            .price-text { display: block !important; }
            input, select, button { display: none !important; }
            table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            th, td { border: 1px solid #ddd; padding: 5px; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
        }
        .print-header { display: none; }
        .bs-text { color: #2563eb; font-weight: bold; font-family: monospace; font-size: 10px; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- PANEL PRINCIPAL -->
    <div id="dashboard" class="flex-1 flex flex-col">
        <header class="bg-slate-800 text-white shadow-lg p-4 sticky top-0 z-40">

        <main class="container mx-auto p-6">
            <!-- PANEL DE CONTROL -->

                <div class="flex flex-wrap gap-6 items-end">
                    <!-- Tasa Euro -->
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tasa Euro BCV (Bs.)</label>
                        <div class="flex items-center gap-2">
                            <input type="number" id="euro-rate" value="60.50" step="0.01" oninput="recalcAll()"
                                class="w-32 p-1.5 border rounded font-bold text-blue-700 text-lg outline-none focus:ring-2 focus:ring-blue-400">
                        </div>
                    </div>

                    <!-- Aumento Masivo -->
                    <div class="bg-orange-50 p-3 rounded-lg border border-orange-100 flex items-end gap-2">
                        <div>
                            <label class="block text-[10px] font-bold text-orange-700 mb-1 uppercase">Aumento %</label>
                            <input type="number" id="bulk-pct" placeholder="5"
                                class="w-20 p-2 text-right font-bold border rounded focus:ring-2 focus:ring-orange-400 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-orange-700 mb-1 uppercase">Redondeo</label>
                            <select id="rounding-rule" class="p-2 text-xs border rounded bg-white outline-none">
                                <option value="none">Exacto</option>
                                <option value="99">.99</option>
                                <option value="50">.50</option>
                            </select>
                        </div>
                        <button onclick="applyBulkUpdate()"
                            class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-4 py-2 rounded text-sm transition">Aplicar</button>
                    </div>

                    <!-- Filtros -->
                    <div class="flex flex-col gap-2 p-3 bg-slate-50 border rounded-lg">
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Categoría</span>
                        <div class="flex flex-wrap gap-2" id="category-checks">
                            <!-- Injected checkboxes -->
                        </div>
                    </div>

                    <!-- Buscador -->
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Buscar</label>
                        <div class="relative">
                            <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="filter" oninput="applyFilter()" placeholder="Producto..."
                                class="w-full pl-10 p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none">
                        </div>
                    </div>

                    <!-- Acciones -->
                    <div class="flex gap-2">
                        <button id="btn-save" onclick="saveChanges()"
                            class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-lg shadow hover:scale-105 transition text-sm flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> <span>Guardar en DB</span>
                        </button>
                        <button onclick="window.print()" class="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold text-sm">
                            <i class="fa-solid fa-print mr-2"></i> PDF
                        </button>
                    </div>
                </div>
            </div>

            <!-- TABLA EDITABLE -->
            <div class="bg-white rounded-xl shadow-lg border overflow-hidden">
                <table class="w-full text-left" id="main-table">
                    <thead class="bg-slate-100 text-[10px] font-bold text-slate-600 uppercase">
                        <tr>
                            <th class="p-4">Producto</th>
                            <th class="p-4">Presentación</th>
                            <th class="p-4 text-right">Costo (USD)</th>
                            <th class="p-4 text-right bg-blue-50">Detal ($)</th>
                            <th class="p-4 text-right bg-green-50">Mayor ($)</th>
                            <th class="p-4 text-right bg-purple-50">Distribuidor ($)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y text-sm" id="table-body">
                        <!-- Products will be injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- LOGIC -->
    <script>
        let products = window.INITIAL_PRODUCTS || [];

        window.onload = initPortal;

        async function initPortal() {
            // Intentar cargar datos frescos del servidor primero
            try {
                const response = await fetch('/api/products'); // Necesitaré añadir este endpoint al server
                if (response.ok) {
                    const freshData = await response.json();
                    if (freshData && freshData.length > 0) {
                        products = freshData;
                        console.log('✅ Datos cargados desde el servidor.');
                    }
                }
            } catch (e) {
                console.log('ℹ️ Usando snapshot local (servidor no detectado).');
            }

            renderTable();
            renderCategories();
            recalcAll();
            checkSyncStatus();
        }

        function checkSyncStatus() {
            const lastSync = localStorage.getItem('last_db_sync');
            if (lastSync) {
                const date = new Date(parseInt(lastSync));
                const statusEl = document.createElement('div');
                statusEl.className = 'text-[10px] text-slate-400 mt-2 italic';
                statusEl.innerHTML = `<i class="fa fa-check-circle text-green-500"></i> Última sincronización: ${date.toLocaleString()}`;
                document.querySelector('main').prepend(statusEl);
            }
        }

        function renderCategories() {
            const cats = [...new Set(products.map(p => p.categoria || "General"))];
            const container = document.getElementById('category-checks');
            container.innerHTML = cats.map(cat => `
                <label class="flex items-center gap-1.5 px-2 py-1 bg-white border rounded text-xs cursor-pointer hover:bg-blue-50 transition">
                    <input type="checkbox" value="${cat}" checked onchange="applyFilter()" class="cat-check"> ${cat}
                </label>
            `).join('');
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = products.map((p, i) => `
                <tr class="product-row hover:bg-slate-50 transition-colors" data-id="${p.id}" data-search="${p.nombre} ${p.presentacion}" data-category="${p.categoria || 'General'}">
                    <td class="p-4 font-bold text-slate-800">${p.nombre}</td>
                    <td class="p-4 text-xs text-slate-500">${p.presentacion}</td>
                    <td class="p-4 text-right">
                        <input type="number" step="0.01" class="cost w-20 text-right p-1 border rounded bg-slate-50" value="${p.costo || 0}" oninput="recalcAll()">
                    </td>
                    <td class="p-4 text-right bg-blue-50/20">
                        <input type="number" step="0.01" class="price-detal w-20 text-right p-1 border rounded font-bold" value="${p.precio || 0}" oninput="recalcAll()">
                        <div class="bs-text">Bs --</div>
                    </td>
                    <td class="p-4 text-right bg-green-50/20">
                        <input type="number" step="0.01" class="price-mayor w-20 text-right p-1 border rounded font-bold" value="${p.precio_mayor || 0}" oninput="recalcAll()">
                        <div class="bs-text">Bs --</div>
                    </td>
                    <td class="p-4 text-right bg-purple-50/20">
                        <input type="number" step="0.01" class="price-dist w-20 text-right p-1 border rounded font-bold" value="${p.precio_dist || 0}" oninput="recalcAll()">
                        <div class="bs-text">Bs --</div>
                    </td>
                </tr>
            `).join('');
        }

        function recalcAll() {
            const euro = parseFloat(document.getElementById('euro-rate').value) || 0;
            const rows = document.querySelectorAll('.product-row');
            
            rows.forEach(row => {
                const pDetal = parseFloat(row.querySelector('.price-detal').value) || 0;
                const pMayor = parseFloat(row.querySelector('.price-mayor').value) || 0;
                const pDist = parseFloat(row.querySelector('.price-dist').value) || 0;
                
                const bsDivs = row.querySelectorAll('.bs-text');
                bsDivs[0].textContent = "Bs " + (pDetal * euro).toLocaleString('es-VE', { minimumFractionDigits: 2 });
                bsDivs[1].textContent = "Bs " + (pMayor * euro).toLocaleString('es-VE', { minimumFractionDigits: 2 });
                bsDivs[2].textContent = "Bs " + (pDist * euro).toLocaleString('es-VE', { minimumFractionDigits: 2 });
            });
        }

        function applyFilter() {
            const query = document.getElementById('filter').value.toLowerCase();
            const activeCats = Array.from(document.querySelectorAll('.cat-check:checked')).map(cb => cb.value.toLowerCase());
            const rows = document.querySelectorAll('.product-row');

            rows.forEach(row => {
                const searchStr = row.getAttribute('data-search').toLowerCase();
                const category = row.dataset.category.toLowerCase();
                const matchesQuery = searchStr.includes(query);
                const matchesCat = activeCats.includes(category);

                row.style.display = (matchesQuery && matchesCat) ? "" : "none";
            });
        }

        function applyBulkUpdate() {
            const pctInput = document.getElementById('bulk-pct').value;
            const rounding = document.getElementById('rounding-rule').value;
            if (!pctInput) return alert('Por favor, ingrese un porcentaje.');
            
            const pct = parseFloat(pctInput) / 100;
            const rows = document.querySelectorAll('.product-row');
            
            rows.forEach(row => {
                if (row.style.display !== "none") {
                    const inputs = ['detal', 'mayor', 'dist'];
                    inputs.forEach(type => {
                        const input = row.querySelector(`.price-${type}`);
                        const newVal = parseFloat(input.value) * (1 + pct);
                        input.value = applyRounding(newVal, rounding);
                    });
                }
            });
            recalcAll();
        }

        function applyRounding(val, type) {
            if (type === '99') return (Math.floor(val) + 0.99).toFixed(2);
            if (type === '50') return (Math.floor(val) + 0.50).toFixed(2);
            return val.toFixed(2);
        }

        async function saveChanges() {
            const btn = document.getElementById('btn-save');
            const originalContent = btn.innerHTML;
            
            // 1. Recolectar datos
            const updatedProducts = Array.from(document.querySelectorAll('.product-row')).map(row => ({
                id: parseInt(row.dataset.id),
                costo: parseFloat(row.querySelector('.cost').value),
                precio: parseFloat(row.querySelector('.price-detal').value),
                precio_mayor: parseFloat(row.querySelector('.price-mayor').value),
                precio_dist: parseFloat(row.querySelector('.price-dist').value)
            }));

            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Sincronizando...';
            btn.disabled = true;

            try {
                // Enviamos los datos al servidor local que procesará Prisma
                const response = await fetch('/api/save-prices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedProducts)
                });

                if (!response.ok) throw new Error('Error en la respuesta del servidor');

                const result = await response.json();
                
                alert('✅ Cambios guardados correctamente en Neon DB y snapshot actualizado.');
                localStorage.setItem('last_db_sync', Date.now().toString());
                location.reload();
            } catch (error) {
                console.error('Error saving:', error);
                alert('❌ Error al guardar: Asegúrate de que el servidor de sincronización esté corriendo.');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }
    </script>
