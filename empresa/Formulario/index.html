<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Trabajo - Ultra Seco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/logo.png">
    <!-- EmailJS SDK para envío de correos -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        // ⚠️ REEMPLAZA ESTOS VALORES CON TUS CREDENCIALES DE EMAILJS
        // Instrucciones: https://www.emailjs.com/
        const EMAILJS_PUBLIC_KEY  = 'TU_PUBLIC_KEY_AQUI';     // Account > API Keys
        const EMAILJS_SERVICE_ID  = 'TU_SERVICE_ID_AQUI';     // Email Services > Service ID
        const EMAILJS_TEMPLATE_ID = 'TU_TEMPLATE_ID_AQUI';   // Email Templates > Template ID
        
        (function(){
            emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        })();
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../images/logo.png" alt="Ultra Seco Logo" class="logo">
            <h1>Ficha de Trabajo</h1>
        </div>
    </header>

    <main class="container">
        <div class="form-header">
            <h2>Postulación para Equipo de Ventas / Distribución</h2>
            <p class="subtitle">Únete al equipo líder en control de humedad</p>
        </div>

        <form id="employmentForm">
            <!-- I. Información Personal y de Contacto -->
            <section>
                <h3><i class="fa-solid fa-user"></i> I. Información Personal y de Contacto</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombres_completos">Nombres Completos</label>
                        <input type="text" id="nombres_completos" name="nombres_completos" required placeholder="Ej: Juan Alberto">
                    </div>
                    <div class="form-group">
                        <label for="apellidos_completos">Apellidos Completos</label>
                        <input type="text" id="apellidos_completos" name="apellidos_completos" required placeholder="Ej: Pérez Rodríguez">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cedula_identidad">Cédula de Identidad</label>
                        <input type="text" id="cedula_identidad" name="cedula_identidad" required placeholder="V-12345678">
                    </div>
                    <div class="form-group">
                        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="foto_cedula">Foto Cédula de Identidad</label>
                        <input type="file" id="foto_cedula" name="foto_cedula" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="foto_rif">Foto R.I.F.</label>
                        <input type="file" id="foto_rif" name="foto_rif" accept="image/*" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nacionalidad">Nacionalidad</label>
                        <input type="text" id="nacionalidad" name="nacionalidad" required placeholder="Ej: Venezolana">
                    </div>
                    <div class="form-group">
                        <label for="telefono_movil">Teléfono Móvil (WhatsApp)</label>
                        <input type="tel" id="telefono_movil" name="telefono_movil" required placeholder="0414-1234567">
                    </div>
                </div>

                <div class="form-group">
                    <label for="correo_electronico">Correo Electrónico</label>
                    <input type="email" id="correo_electronico" name="correo_electronico" required placeholder="usuario@ejemplo.com">
                </div>

                <div class="form-group">
                    <label for="domicilio">Domicilio / Dirección de Residencia</label>
                    <textarea id="domicilio" name="domicilio" required placeholder="Dirección detallada"></textarea>
                </div>

                <div class="form-row" style="align-items: center; gap: 20px;">
                    <div class="checkbox-group" style="flex: 1;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="vehiculo_propio" name="vehiculo_propio" onchange="toggleVehiculoInfo()"> Tiene vehículo propio
                        </label>
                    </div>
                    <div id="vehiculo_info" class="form-group" style="display: none; flex: 2; margin-bottom: 0;">
                        <input type="text" id="vehiculo_modelo_year" name="vehiculo_modelo_year" placeholder="Modelo y Año del vehículo">
                    </div>
                </div>
            </section>

            <!-- II. Perfil Comercial y Experiencia -->
            <section>
                <h3><i class="fa-solid fa-briefcase"></i> II. Perfil Comercial y Experiencia</h3>
                <div class="form-group">
                    <label for="zona_ventas">Zona o Región donde impulsaría ventas</label>
                    <input type="text" id="zona_ventas" name="zona_ventas" required placeholder="Ej: Zona Norte, Estado Zulia...">
                </div>
                <div class="form-group">
                    <label for="experiencia_ferretera">¿Posee experiencia en el ramo ferretero o construcción?</label>
                    <textarea id="experiencia_ferretera" name="experiencia_ferretera" placeholder="Detalle años y empresas si aplica"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientes_principales">¿Maneja actualmente una cartera de clientes?</label>
                        <input type="text" id="clientes_principales" name="clientes_principales" placeholder="Tipo de clientes">
                    </div>
                    <div class="form-group">
                        <label for="cantidad_clientes">Cant. de clientes potenciales</label>
                        <input type="number" id="cantidad_clientes" name="cantidad_clientes" placeholder="Ej: 50" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label for="volumen_facturacion">¿A cuánto asciende su volumen de facturación promedio mensual?</label>
                    <input type="text" id="volumen_facturacion" name="volumen_facturacion" placeholder="Opcional">
                </div>
            </section>

            <!-- III. Referencias Personales -->
            <section>
                <h3><i class="fa-solid fa-users"></i> III. Referencias Personales</h3>
                <div class="reference-container">
                    <div class="ref-item">
                        <label>Referencia 1</label>
                        <input type="text" name="referencia_1_nombre" placeholder="Nombre completo">
                        <input type="tel" name="referencia_1_telefono" placeholder="Teléfono">
                        <input type="text" name="referencia_1_relacion" placeholder="Relación (Amigo, Ex-jefe, etc)">
                    </div>
                    <div class="ref-item">
                        <label>Referencia 2</label>
                        <input type="text" name="referencia_2_nombre" placeholder="Nombre completo">
                        <input type="tel" name="referencia_2_telefono" placeholder="Teléfono">
                        <input type="text" name="referencia_2_relacion" placeholder="Relación">
                    </div>
                </div>
            </section>

            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> Enviar Solicitud
            </button>
        </form>

        <div id="message" class="message"></div>
    </main>

    <script>
        function toggleVehiculoInfo() {
            const check = document.getElementById('vehiculo_propio');
            const info = document.getElementById('vehiculo_info');
            info.style.display = check.checked ? 'block' : 'none';
        }

        // URL del Cloudflare Worker configurado para Neon
        const WORKER_URL = 'https://formulario-ultraseco.workthingstesting.workers.dev/';

        async function compressImage(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        document.getElementById('employmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando imágenes...';
            
            const fileCedula = document.getElementById('foto_cedula').files[0];
            const fileRif = document.getElementById('foto_rif').files[0];
            const base64Cedula = await compressImage(fileCedula);
            const base64Rif = await compressImage(fileRif);

            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando solicitud...';

            const get = id => (document.getElementById(id) || {}).value || '';
            const getN = name => (document.querySelector(`[name="${name}"]`) || {}).value || '';

            const formData = {
                nombres_completos: get('nombres_completos'),
                apellidos_completos: get('apellidos_completos'),
                cedula_identidad: get('cedula_identidad'),
                fecha_nacimiento: get('fecha_nacimiento'),
                nacionalidad: get('nacionalidad'),
                domicilio: get('domicilio'),
                telefono_movil: get('telefono_movil'),
                correo_electronico: get('correo_electronico'),
                vehiculo_propio: document.getElementById('vehiculo_propio').checked,
                vehiculo_modelo_year: get('vehiculo_modelo_year'),
                zona_ventas: get('zona_ventas'),
                experiencia_ferretera: get('experiencia_ferretera'),
                clientes_principales: get('clientes_principales'),
                cantidad_clientes: get('cantidad_clientes'),
                volumen_facturacion: get('volumen_facturacion'),
                referencia_1_nombre: getN('referencia_1_nombre'),
                referencia_1_telefono: getN('referencia_1_telefono'),
                referencia_1_relacion: getN('referencia_1_relacion'),
                referencia_2_nombre: getN('referencia_2_nombre'),
                referencia_2_telefono: getN('referencia_2_telefono'),
                referencia_2_relacion: getN('referencia_2_relacion'),
                foto_cedula: base64Cedula,
                foto_rif: base64Rif
            };

            const msg = [
                '🟦 *NUEVA FICHA DE TRABAJO*',
                `• Aspirante: ${formData.nombres_completos} ${formData.apellidos_completos}`,
                `• Cédula: ${formData.cedula_identidad}`,
                `• Teléfono: ${formData.telefono_movil}`
            ].join('\n');
            const waUrl = `https://wa.me/584146023797?text=${encodeURIComponent(msg)}`;

            // === ENVÍO A BASE DE DATOS (Cloudflare Worker + Neon DB) ===
            let dbOk = false;
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) dbOk = true;
                } else {
                    const errorData = await response.json();
                    console.error('Error DB detallado:', errorData);
                }
            } catch (error) {
                console.error('Error DB:', error);
            }

            // === ENVÍO DE CORREO VÍA EMAILJS ===
            let emailOk = false;
            try {
                const vehiculoInfo = formData.vehiculo_propio 
                    ? `Sí — ${formData.vehiculo_modelo_year || 'Sin especificar modelo'}`
                    : 'No';

                const emailParams = {
                    to_email:              'ultraseco_vzla@gmail.com',
                    nombres_completos:     formData.nombres_completos,
                    apellidos_completos:   formData.apellidos_completos,
                    cedula_identidad:      formData.cedula_identidad,
                    fecha_nacimiento:      formData.fecha_nacimiento,
                    nacionalidad:          formData.nacionalidad,
                    domicilio:             formData.domicilio,
                    telefono_movil:        formData.telefono_movil,
                    correo_electronico:    formData.correo_electronico,
                    vehiculo_propio:       vehiculoInfo,
                    zona_ventas:           formData.zona_ventas,
                    experiencia_ferretera: formData.experiencia_ferretera || 'No especificada',
                    clientes_principales:  formData.clientes_principales || 'No especificada',
                    cantidad_clientes:     formData.cantidad_clientes || 'N/A',
                    volumen_facturacion:   formData.volumen_facturacion || 'No especificado',
                    referencia_1_nombre:   formData.referencia_1_nombre || 'N/A',
                    referencia_1_telefono: formData.referencia_1_telefono || 'N/A',
                    referencia_1_relacion: formData.referencia_1_relacion || 'N/A',
                    referencia_2_nombre:   formData.referencia_2_nombre || 'N/A',
                    referencia_2_telefono: formData.referencia_2_telefono || 'N/A',
                    referencia_2_relacion: formData.referencia_2_relacion || 'N/A',
                    fecha_envio:           new Date().toLocaleString('es-VE', { timeZone: 'America/Caracas' })
                };

                if (EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY_AQUI') {
                    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, emailParams);
                    emailOk = true;
                    console.log('✅ Correo enviado correctamente a ultraseco_vzla@gmail.com');
                } else {
                    console.warn('⚠️ EmailJS no configurado. Reemplaza las credenciales en el código.');
                }
            } catch (emailError) {
                console.error('Error al enviar correo:', emailError);
            }

            // Mostrar resultado final
            if (dbOk || emailOk) {
                messageDiv.className = 'message success';
                messageDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> ¡Solicitud enviada exitosamente! Redirigiendo...';
            } else {
                messageDiv.className = 'message warning';
                messageDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Solicitud enviada por WhatsApp. Revisa la consola para más detalles.';
            }

            setTimeout(() => {
                e.target.reset();
                document.getElementById('vehiculo_info').style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Solicitud';
                window.open(waUrl, '_blank');
            }, 1500);
        });
    </script>

<!-- WhatsApp Float Button -->
<style>
.whatsapp-float {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #25d366;
    color: white;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    text-align: center;
    font-size: 32px;
    box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.whatsapp-float:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 2px 6px 12px rgba(0,0,0,0.4);
    color: white;
}
</style>
<a href="https://wa.me/584146023797" class="whatsapp-float" target="_blank" aria-label="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
</a>
<!-- End WhatsApp Float Button -->
</body>

</html>
