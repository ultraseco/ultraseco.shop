<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Chat Asesor Ultra Seco</title>

    <!-- Essential Styles and Scripts for Header -->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f7; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding-top: 80px; }
        .chat-container { width: 90%; max-width: 450px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; margin-top: auto; margin-bottom: auto;}
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; font-size: 1.2em; font-weight: bold; }
        #chat-box { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fff; }
        .msg { padding: 12px 16px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; max-width: 80%; }
        .user { align-self: flex-end; background: #3498db; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #f1f0f0; color: #333; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #eee; background: white; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 25px; outline: none; transition: border 0.3s; }
        input:focus { border-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <!-- Navigation Bar (Extracted from fortificador.html) -->
    <header
        class="fixed top-0 left-0 w-full z-[9999] bg-slate-900/95 backdrop-blur-md border-b border-slate-700 transition-all duration-300">
        <nav
            style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 5%;">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Ultra Seco" style="height: 40px;">
            </a>

            <!-- Mobile menu toggle button -->
            <button class="mobile-menu-toggle flex md:hidden text-white" onclick="toggleMobileMenu()" aria-label="Toggle menu">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>

            <ul class="nav-links flex items-center gap-6 list-none m-0 p-0">
                <li><a href="index.html#inicio" class="!text-white hover:!text-[#00a8e8] text-[14px] font-semibold transition"
                        style="text-decoration: none;">Inicio</a></li>
                <li><a href="asesor.html" class="!text-white hover:!text-[#00a8e8] text-[14px] font-semibold transition"
                        style="text-decoration: none;">Asesor IA</a></li>
                <li><a href="index.html#productos" class="!text-white hover:!text-[#00a8e8] text-[14px] font-semibold transition"
                        style="text-decoration: none;">Productos</a></li>
                <li>
                    <button onclick="window.history.back()"
                        class="flex items-center gap-2 !text-white hover:!text-[#00a8e8] text-[14px] font-bold bg-transparent border-none cursor-pointer transition">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </button>
                </li>
                <li><a href="asesor.html" target="_blank"
                        class="bg-green-600 !text-white px-4 py-2 rounded-full font-bold text-sm hover:bg-green-500 transition"
                        style="text-decoration: none;"><i class="fa-solid fa-brain"></i> Asesor IA
                    </a>
                </li>
            
                <li><a href="carrito.html" class="!text-white hover:!text-[#00a8e8] text-[14px] font-semibold transition flex items-center gap-2" style="text-decoration: none; position: relative;">
                    <i class="fa-solid fa-cart-shopping"></i> Carrito
                    <span id="cart-badge" style="position: absolute; top: -8px; right: -12px; background: #ef4444; color: white; border-radius: 50%; height: 20px; min-width: 20px; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; justify-content: center; display: none;">0</span>
                </a></li>
            </ul>
        </nav>
    </header>

<div class="chat-container">
    <div class="header">Asesor Ultra Seco 🏠</div>
    <div id="chat-box">
        <div class="msg ai"><b>Asesor:</b> ¡Hola! Soy el experto en impermeabilización. ¿Cómo puedo ayudarte con tu proyecto hoy?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu duda aquí..." onkeypress="revisarEnter(event)">
        <button onclick="enviarMensaje()">ENVIAR</button>
    </div>
</div>

<script src="asesor.js"></script>
<script src="script.js"></script>
    <script src="js/price-sync.js"></script>
</body>
</html>
